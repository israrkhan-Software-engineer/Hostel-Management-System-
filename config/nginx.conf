# Production reverse proxy. Mount real TLS certificate and key at these paths.
events { worker_connections 2048; }

pid /tmp/nginx.pid;

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format main '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent "$http_user_agent" "$http_x_request_id"';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  server_tokens off;
  client_max_body_size 6m;
  limit_req_status 429;
  limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=password_reset:10m rate=3r/m;
  limit_req_zone $binary_remote_addr zone=public:10m rate=30r/s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080 default_server;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 8443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/nginx/cert.pem;
    ssl_certificate_key /etc/nginx/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/v1/auth/login {
      limit_req zone=login burst=3 nodelay;
      include /etc/nginx/hms-api-proxy.conf;
    }

    location = /api/v1/platform/admin/auth/login {
      limit_req zone=login burst=2 nodelay;
      include /etc/nginx/hms-api-proxy.conf;
    }

    location ~ ^/api/v1/auth/reset-password(?:/complete)?$ {
      limit_req zone=password_reset burst=2 nodelay;
      include /etc/nginx/hms-api-proxy.conf;
    }

    location /api/ {
      limit_req zone=api burst=50 nodelay;
      include /etc/nginx/hms-api-proxy.conf;
    }

    location / {
      limit_req zone=public burst=20 nodelay;
      proxy_pass http://frontend:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
