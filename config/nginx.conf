# HMS nginx reverse proxy — proposed 🟡
# TLS certificate paths are placeholders; replace with real certs before production.
# Internal ports for postgres, redis, minio are NOT exposed here.

events { worker_connections 1024; }

http {
  # Logging — no sensitive data in access logs
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" "$http_x_request_id"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # Security defaults
  server_tokens off;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=api:10m    rate=100r/s;
  limit_req_zone $binary_remote_addr zone=public:10m rate=30r/s;

  # HTTP → HTTPS redirect
  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    # Replace with real certificate paths
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # API
    location /api/ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass         http://api:3001;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Request-ID $request_id;
    }

    # Login — stricter rate limit
    location /api/v1/auth/login {
      limit_req zone=login burst=3 nodelay;
      proxy_pass http://api:3001;
    }

    # Frontend
    location / {
      limit_req zone=public burst=20 nodelay;
      proxy_pass         http://frontend:3000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
