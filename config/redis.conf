# HMS Redis configuration — proposed 🟡
# Redis is NEVER the source of truth for financial, allocation or identity records.

# Persistence — appendonly for queue durability
appendonly yes
appendfsync everysec

# Memory limit (tune per environment)
maxmemory 512mb
maxmemory-policy allkeys-lru

# Disable dangerous commands
rename-command FLUSHALL ""
rename-command FLUSHDB  ""
rename-command DEBUG    ""

# Bind to internal network only — do NOT bind 0.0.0.0 in production
bind 0.0.0.0
protected-mode no
