# ==============================================================================
# HMS PostgreSQL 16 Configuration: Continuous WAL Archiving & PITR Support
# ==============================================================================
# Include this configuration in postgresql.conf or mount to /etc/postgresql/
# Supports Recovery Point Objective (RPO) <= 15 minutes.
# ==============================================================================

# Enable write-ahead logging suitable for standby and point-in-time recovery
wal_level = replica

# Enable continuous WAL archiving
archive_mode = on

# Command executed upon completion of each WAL segment (16 MB)
archive_command = '/usr/local/bin/archive-wal.sh %p %f'

# Force a WAL switch every 15 minutes (900 seconds) if no segment has completed.
# This guarantees that at most 15 minutes of transactional data is unarchived,
# directly supporting the project requirement: RPO <= 15 minutes.
archive_timeout = 900

# Recommended WAL configuration for high-throughput SaaS workloads
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# Restore configuration template for Point-in-Time Recovery (PITR):
# When performing PITR, place a 'recovery.signal' file in the PGDATA directory
# and configure the restore_command:
# restore_command = '/usr/local/bin/restore-wal.sh %f %p'
# recovery_target_time = '2026-11-17 12:00:00 UTC'
# recovery_target_action = 'promote'
